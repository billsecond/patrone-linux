# Patrone's guest tools: run hv_vss_daemon from any installed kernel's
# linux-cloud-tools when the running kernel's aren't there (hv-tool), in a
# mount namespace of its own without the desktops' FUSE mounts, which
# hv_vss_daemon would try to freeze and fail on (vss-hide-fuse).
[Service]
MountFlags=private
ExecStart=
ExecStart=/usr/libexec/patrone-guest-tools/vss-hide-fuse /usr/libexec/patrone-guest-tools/hv-tool hv_vss_daemon -n
