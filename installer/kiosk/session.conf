# The "Install Patrone Linux" session: GNOME Kiosk and the installer, and
# GNOME's settings daemons for accessibility, the keyboard and media keys.
# No desktop autostart: some of the live session's (update-notifier's, for
# one) would open windows, which Kiosk makes full screen over the installer.
[Unit]
Requires=org.gnome.Kiosk.target
Requires=patrone-installer-kiosk.service
Wants=org.gnome.SettingsDaemon.A11ySettings.target
Wants=org.gnome.SettingsDaemon.Keyboard.target
Wants=org.gnome.SettingsDaemon.MediaKeys.target
Conflicts=xdg-desktop-autostart.target
