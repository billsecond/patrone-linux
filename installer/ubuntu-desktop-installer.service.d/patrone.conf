# "Try PatroneOS": the live session starts Patrone's installer in place
# of the snap's, and leaves Ubuntu's desktop icons and dock alone when it
# closes (Ubuntu's turns them back on; Patrone's taskbar and File Manager's
# desktop take their place). "Install PatroneOS" has its own session,
# with the installer alone (kiosk/), so this stays out of it.
[Unit]
Description=PatroneOS Installer
ConditionKernelCommandLine=!patrone-install-only

[Service]
ExecStart=
ExecStart=/usr/bin/patrone-installer --try-or-install
ExecStopPost=
