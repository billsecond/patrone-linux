<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Virtual Machine Setup</title>
  <!-- Patrone Virtual Machine Setup: a Patrone-blue screen with a second,
       white one inside it (a computer in a computer), on a stand. Bold
       shapes only, so it stays clear at 16 pixels. -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4da0fc"/>
      <stop offset="1" stop-color="#1d5cc4"/>
    </linearGradient>
  </defs>
  <path d="M54 94h20l4 16H50z" fill="#1851a8"/>
  <rect x="38" y="106" width="52" height="10" rx="5" fill="#1851a8"/>
  <rect x="8" y="14" width="112" height="82" rx="12" fill="url(#screen)"/>
  <rect x="8.5" y="14.5" width="111" height="81" rx="11.5" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
  <rect x="28" y="30" width="72" height="50" rx="7" fill="#ffffff"/>
  <path d="M28 44h72" stroke="#1d5cc4" stroke-width="6"/>
</svg>
