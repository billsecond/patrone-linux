[package]
name = "patrone-hyperv-setup"
version = "0.2.1"
edition = "2024"
# Ubuntu 26.04's rustc, which builds the package
rust-version = "1.93"
description = "Patrone Virtual Machine Setup: offers, at login, to set up what PatroneOS needs in a Hyper-V virtual machine"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# Ubuntu 26.04 ships GNOME 50 (GTK 4.22, GLib 2.88).
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }

[profile.release]
lto = true
