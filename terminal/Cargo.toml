[package]
name = "patrone-terminal"
version = "0.1.0"
edition = "2024"
description = "Patrone Terminal, the default terminal of Patrone Linux"
publish = false

[dependencies]
# Ubuntu 26.04 ships VTE 0.84 and GNOME 50 (GTK 4.22, GLib 2.88).
vte = { package = "vte4", version = "0.10", features = ["v0_84"] }
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }

[profile.release]
lto = true
