<?xml version="1.0" encoding="UTF-8"?>
<!-- Patrone Terminal icon. A placeholder until the Patrone mark has a vector
     master: a slanted prompt in the Patrone blues on a near-black tile. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141C2A"/>
      <stop offset="1" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DA0FC"/>
      <stop offset="0.5" stop-color="#288BFA"/>
      <stop offset="1" stop-color="#1851A8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="12" width="112" height="104" rx="22" fill="url(#tile)"/>
  <rect x="8.5" y="12.5" width="111" height="103" rx="21.5" fill="none" stroke="#2372DD" stroke-opacity="0.45"/>
  <g transform="skewX(-12) translate(14 0)">
    <path d="M30 42 L56 64 L30 86" fill="none" stroke="url(#blue)" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="62" y="80" width="34" height="11" rx="5.5" fill="url(#blue)"/>
  </g>
</svg>
