<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Patrone Terminal icon: a white prompt and a Patrone-blue cursor on a dark
       screen, in a lighter frame so the icon stands out on dark menus and
       light ones alike. Bold shapes only, so it stays clear at 16 pixels.
       The comment is inside the svg element: image loaders recognise an SVG
       by "<svg" in its first 256 bytes, and above it, this pushed it past
       them, so GNOME Shell couldn't load the icon -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7a96"/>
      <stop offset="1" stop-color="#435069"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2535"/>
      <stop offset="1" stop-color="#0e131c"/>
    </linearGradient>
  </defs>
  <rect x="8" y="14" width="112" height="100" rx="18" fill="url(#frame)"/>
  <rect x="8.5" y="14.5" width="111" height="99" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
  <rect x="17" y="31" width="94" height="74" rx="10" fill="url(#screen)"/>
  <path d="M33 52 L51 68 L33 84" fill="none" stroke="#ffffff" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="59" y="77" width="32" height="10" rx="5" fill="#4da0fc"/>
</svg>
