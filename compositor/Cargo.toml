[package]
name = "patrone-compositor"
version = "0.1.0"
edition = "2024"
description = "The Patrone Desktop compositor"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3"

[dependencies.smithay]
version = "0.7"
default-features = false
# Nested in another desktop (winit), or on the screen itself (DRM/KMS, GBM,
# libinput, a libseat session). Both draw with OpenGL ES.
features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "renderer_gl",
    "desktop",
    "wayland_frontend",
]

[profile.release]
lto = true
