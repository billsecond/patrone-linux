[package]
name = "patrone-compositor"
version = "0.1.0"
edition = "2024"
description = "The Patrone Desktop compositor"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7"
default-features = false
# Nested in another desktop for now: winit for the window, GLES to draw.
features = ["backend_winit", "desktop", "wayland_frontend"]

[profile.release]
lto = true
