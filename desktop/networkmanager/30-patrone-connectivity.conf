# NetworkManager's check for Wi-Fi sign-in pages (in hotels, airports) asks
# GNOME's server instead of Ubuntu's connectivity-check.ubuntu.com. It reads
# this after Ubuntu's 20-connectivity-ubuntu.conf, so this one wins. Settings
# -> Privacy & Security -> Connectivity still turns the check off.
[connectivity]
uri=http://nmcheck.gnome.org/check_network_status.txt
