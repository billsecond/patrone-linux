<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Patrone Task Manager: a white pulse line over a faint graph, on a
       Patrone-blue tile. Bold shapes only, so it stays clear at 16 pixels. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4da0fc"/>
      <stop offset="1" stop-color="#1d5cc4"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#tile)"/>
  <rect x="10.5" y="10.5" width="107" height="107" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
  <!-- The graph's floor: the part of the line that's filled in -->
  <path d="M24 68 H42 L54 38 L70 92 L82 58 L88 68 H104 V96 H24 Z" fill="#ffffff" fill-opacity="0.16"/>
  <path d="M24 68 H42 L54 38 L70 92 L82 58 L88 68 H104" fill="none" stroke="#ffffff" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
