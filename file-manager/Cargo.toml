[package]
name = "patrone-file-manager"
version = "0.1.0"
edition = "2024"
# Ubuntu 26.04's rustc, which builds the package
rust-version = "1.93"
description = "Patrone File Manager, the file manager of Patrone Linux"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# Ubuntu 26.04 ships GNOME 50 (GTK 4.22, GLib 2.88).
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "0.4"
flate2 = "1"
# The desktop moves its standard streams aside (desktop.rs); GLib already
# brings it in.
libc = "0.2"

[profile.release]
lto = true
