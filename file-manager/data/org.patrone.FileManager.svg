<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Patrone File Manager: a folder in Patrone's blues (branding/README.md),
       its tab on the right and its front cut on the slant of the Patrone P,
       with a sheet of paper inside and two slanted streaks of light across
       the front. Bold shapes only, so it stays clear at 16 pixels. -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1851a8"/>
      <stop offset="1" stop-color="#134394"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4da0fc"/>
      <stop offset="0.5" stop-color="#288bfa"/>
      <stop offset="1" stop-color="#2372dd"/>
    </linearGradient>
    <clipPath id="front-shape">
      <path d="M8 64a7 7 0 0 1 6.2-7l98-11.4a7 7 0 0 1 7.8 7V106a8 8 0 0 1-8 8H16a8 8 0 0 1-8-8z"/>
    </clipPath>
  </defs>
  <path d="M8 34a8 8 0 0 1 8-8h50l8-8h38a8 8 0 0 1 8 8v80a8 8 0 0 1-8 8H16a8 8 0 0 1-8-8z" fill="url(#back)"/>
  <rect x="20" y="30" width="86" height="30" rx="3" fill="#ffffff" transform="rotate(-5 63 45)"/>
  <rect x="30" y="38" width="44" height="4" rx="2" fill="#bcd9fd" transform="rotate(-5 63 45)"/>
  <path d="M8 64a7 7 0 0 1 6.2-7l98-11.4a7 7 0 0 1 7.8 7V106a8 8 0 0 1-8 8H16a8 8 0 0 1-8-8z" fill="url(#front)"/>
  <g clip-path="url(#front-shape)" fill="#ffffff">
    <path d="M70 120h20l30-82h-20z" opacity="0.16"/>
    <path d="M96 120h8l30-82h-8z" opacity="0.12"/>
  </g>
  <path d="M8.6 61.4a7 7 0 0 1 5.6-4.4l98-11.4a7 7 0 0 1 7.2 3.6" fill="none" stroke="#a9d1ff" stroke-width="2"/>
</svg>
