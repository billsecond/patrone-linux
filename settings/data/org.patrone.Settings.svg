<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Patrone Settings: sliders on a Patrone-blue tile -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d8eff"/>
      <stop offset="1" stop-color="#1d5cc4"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="104" height="104" rx="24" fill="url(#tile)"/>
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="34" y1="42" x2="94" y2="42"/>
    <line x1="34" y1="64" x2="94" y2="64"/>
    <line x1="34" y1="86" x2="94" y2="86"/>
  </g>
  <g fill="#ffffff" stroke="#1d5cc4" stroke-width="4">
    <circle cx="76" cy="42" r="9"/>
    <circle cx="50" cy="64" r="9"/>
    <circle cx="82" cy="86" r="9"/>
  </g>
</svg>
