<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Patrone Settings: a white gear on a Patrone-blue tile. Bold shapes
       only, so it stays clear at 16 pixels. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4da0fc"/>
      <stop offset="1" stop-color="#1d5cc4"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#tile)"/>
  <rect x="10.5" y="10.5" width="107" height="107" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
  <g fill="#ffffff" transform="translate(64 64)">
    <circle r="28"/>
    <rect x="-8" y="-42" width="16" height="18" rx="3"/>
    <rect x="-8" y="-42" width="16" height="18" rx="3" transform="rotate(45)"/>
    <rect x="-8" y="-42" width="16" height="18" rx="3" transform="rotate(90)"/>
    <rect x="-8" y="-42" width="16" height="18" rx="3" transform="rotate(135)"/>
    <rect x="-8" y="-42" width="16" height="18" rx="3" transform="rotate(180)"/>
    <rect x="-8" y="-42" width="16" height="18" rx="3" transform="rotate(225)"/>
    <rect x="-8" y="-42" width="16" height="18" rx="3" transform="rotate(270)"/>
    <rect x="-8" y="-42" width="16" height="18" rx="3" transform="rotate(315)"/>
  </g>
  <circle cx="64" cy="64" r="12" fill="#2a74e0"/>
</svg>
