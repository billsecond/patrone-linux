<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Patrone Unpack: a white box with a zip down its middle on a
       Patrone-blue tile. Bold shapes only, so it stays clear at 16 pixels. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4da0fc"/>
      <stop offset="1" stop-color="#1d5cc4"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#tile)"/>
  <rect x="10.5" y="10.5" width="107" height="107" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
  <!-- The box and its lid -->
  <rect x="28" y="46" width="72" height="54" rx="7" fill="#ffffff"/>
  <rect x="23" y="30" width="82" height="22" rx="6" fill="#ffffff"/>
  <rect x="28" y="52" width="72" height="4" fill="#1d5cc4" fill-opacity="0.22"/>
  <!-- The zip's teeth, and its pull -->
  <g fill="#2a74e0">
    <rect x="58" y="30" width="6" height="5"/>
    <rect x="64" y="35" width="6" height="5"/>
    <rect x="58" y="40" width="6" height="5"/>
    <rect x="64" y="45" width="6" height="5"/>
    <rect x="58" y="50" width="6" height="5"/>
    <rect x="64" y="55" width="6" height="5"/>
    <rect x="58" y="85" width="6" height="5"/>
    <rect x="64" y="90" width="6" height="5"/>
    <rect x="58" y="95" width="6" height="5"/>
  </g>
  <rect x="55" y="60" width="18" height="26" rx="5" fill="#1d5cc4"/>
  <circle cx="64" cy="77" r="3.5" fill="#ffffff"/>
</svg>
