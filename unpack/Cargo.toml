[package]
name = "patrone-unpack"
version = "0.1.2"
edition = "2024"
# Ubuntu 26.04's rustc, which builds the package
rust-version = "1.93"
description = "Patrone Unpack: opens archives to extract them, and installs .deb packages and Flatpak apps"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# Ubuntu 26.04 ships GNOME 50 (GTK 4.22, GLib 2.88).
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }

[profile.release]
lto = true
