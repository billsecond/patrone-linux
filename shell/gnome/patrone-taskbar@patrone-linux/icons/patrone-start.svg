<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 388 388" width="64" height="64">
  <!-- The Patrone mark (branding/logos/patrone-logo.png) as vectors, for the
       Start button: the upper band with the bowl's top, the bowl's lower
       part, and the slanted stem. -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#3d8eff"/>
      <stop offset="1" stop-color="#5aa6ff"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f80f4"/>
      <stop offset="1" stop-color="#1f66d6"/>
    </linearGradient>
    <linearGradient id="stem" x1="0.6" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3a8cff"/>
      <stop offset="0.55" stop-color="#2a78ec"/>
      <stop offset="0.56" stop-color="#2266d2"/>
      <stop offset="1" stop-color="#1d5cc4"/>
    </linearGradient>
  </defs>
  <path fill="url(#top)" d="M86 68 H306 C356 68 393 106 393 150 C393 156 392 162 391 167 H140 Z"/>
  <path fill="url(#bowl)" d="M262 180 H379 C368 228 330 262 288 262 H213 Z"/>
  <path fill="url(#stem)" d="M133 180 H237 L131 352 H28 Z"/>
</svg>
