<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Patrone's Recycle Bin, empty: a Patrone-blue bin under a floating lid,
       with a white loop of an arrow on it (what's in it can come back until
       it's emptied). Patrone's own, neither a grey bin nor a wire basket. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4da0fc"/>
      <stop offset="1" stop-color="#1d5cc4"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5d8ff"/>
      <stop offset="1" stop-color="#62abfc"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M13 22H51L47.6 52.2A6 6 0 0 1 41.6 58H22.4A6 6 0 0 1 16.4 52.2Z" fill="url(#body)"/>
  <path d="M13 22H31L29.6 58H22.4A6 6 0 0 1 16.4 52.2Z" fill="url(#shine)"/>
  <path d="M38.9 35A8 8 0 1 1 32 31" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M37.4 31L32 26.8V35.2Z" fill="#ffffff"/>
  <rect x="10" y="14" width="44" height="6" rx="3" fill="url(#lid)"/>
  <rect x="26" y="9.2" width="12" height="5.6" rx="2.8" fill="none" stroke="#b5d8ff" stroke-width="2.4"/>
</svg>
