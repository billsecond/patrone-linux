# Patrone's font aliases for Flatpak apps (sans-serif, system-ui and Segoe UI
# as Patrone Sans): fontconfig looks for its fonts.conf in this folder first.
# The folder is there only inside a Flatpak sandbox, where it's the host's
# /usr/share/fonts/patrone-fontconfig, so on the system itself fontconfig
# carries on to /etc/fonts as before. See that folder's fonts.conf.
FONTCONFIG_PATH=/run/host/fonts/patrone-fontconfig${FONTCONFIG_PATH:+:$FONTCONFIG_PATH}
