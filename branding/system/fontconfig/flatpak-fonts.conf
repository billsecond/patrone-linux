<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Patrone's font aliases for Flatpak apps.

  A Flatpak app's fontconfig is its runtime's, which never sees the host's
  /etc/fonts, so sans-serif, system-ui and Segoe UI gave the runtime's own
  font (DejaVu Sans) there, though Patrone Sans is in every sandbox with
  the host's other fonts (/usr/share/fonts, mounted at /run/host/fonts).

  Patrone's sessions set FONTCONFIG_PATH=/run/host/fonts/patrone-fontconfig
  (/etc/environment.d/60-patrone-fontconfig.conf), and fontconfig looks
  for its fonts.conf there before its own folder. On the host that folder
  doesn't exist, so fontconfig goes on to /etc/fonts as ever. In a sandbox
  it finds this file (the host's /usr/share/fonts/patrone-fontconfig/
  fonts.conf), which loads Patrone's aliases first, then the runtime's own
  configuration, whose preferences come after them. An app that names a
  fonts.conf of its own (FONTCONFIG_FILE) keeps it.
-->
<fontconfig>
  <!-- The fonts, should a runtime have no /etc/fonts/fonts.conf; a
       runtime's own configuration starts its list afresh (<reset-dirs/>) -->
  <dir>/usr/share/fonts</dir>
  <dir>/app/share/fonts</dir>
  <dir>/run/host/fonts</dir>
  <dir>/run/host/local-fonts</dir>
  <dir>/run/host/user-fonts</dir>

  <include ignore_missing="yes">/run/host/fonts/patrone-fontconfig/05-patrone-fonts.conf</include>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
