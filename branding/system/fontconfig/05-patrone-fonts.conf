<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Patrone's interface font is Inter, close to Microsoft's Segoe UI (which no
  one may redistribute) and the font Patrone's own apps, like MailCraft,
  use. GNOME's own setting (font-name) chooses it for the desktop and apps;
  this does the rest:

  - "sans-serif" means Inter first, for apps and pages that ask for the
    generic family. Numbered 05 so it comes before Ubuntu's own preferences
    (56-language-selector-prefer.conf, and 10-prefer-noto.conf in snaps),
    which put their fonts after it.
  - Pages and documents that ask for Segoe UI by name, as many web sites
    and Microsoft's own do, get Inter instead of whatever came next in
    their list. The binding is strong ("same"), which Chromium requires
    before it uses a substitute for a font asked for by name.

  Installed in /etc/fonts/conf.d and, for snaps such as Chromium (which
  read the system's /etc/fonts/snap-override, not conf.d), in
  /etc/fonts/snap-override.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <!-- CSS's system-ui: browsers map it to the desktop's font themselves;
       this is for apps that ask fontconfig -->
  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Segoe UI</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Variable</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Variable Text</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Variable Display</family>
    <prefer>
      <family>Inter Display</family>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Variable Small</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <!-- "Segoe UI Semibold" and "Segoe UI Light" are families of their own
       on Windows; here they're Inter at that weight -->
  <match target="pattern">
    <test name="family">
      <string>Segoe UI Semibold</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Inter</string>
    </edit>
    <edit name="weight" mode="assign">
      <const>semibold</const>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Segoe UI Light</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Inter</string>
    </edit>
    <edit name="weight" mode="assign">
      <const>light</const>
    </edit>
  </match>
</fontconfig>
