<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  PatroneOS's fonts (fonts-patroneos) as the system's: PatroneOS Sans for
  sans-serif, PatroneOS Serif for serif and PatroneOS Mono for monospace,
  each with Noto behind it for the scripts it doesn't cover. GNOME's own
  settings (font-name, document-font-name, monospace-font-name) choose them
  for the desktop and apps; this does the rest. Numbered 05 so it comes
  before Ubuntu's preferences (56-language-selector-prefer.conf, and
  10-prefer-noto.conf in snaps) and fontconfig's metric aliases
  (30-metric-aliases.conf), which put their fonts after these.

  Documents and pages that ask for a font by name, where PatroneOS has one
  with the same width for each letter, get it: PatroneOS Document for
  Calibri, PatroneOS Classic for Arial and Helvetica. So they keep their
  layout. The classic serif fonts are left to Liberation Serif and Caladea
  (30-metric-aliases.conf), and "Patrone Sans", which PatroneOS Sans
  replaced, is PatroneOS Sans. The bindings are strong ("same"), which
  Chromium requires before it uses a substitute for a font asked for by
  name.

  Installed in /etc/fonts/conf.d and, for snaps such as Chromium (which
  read the system's /etc/fonts/snap-override, not conf.d), in
  /etc/fonts/snap-override. Flatpak apps, which see neither, read it from
  /usr/share/fonts/patrone-fontconfig (see flatpak-fonts.conf).
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>PatroneOS Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>PatroneOS Serif</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>PatroneOS Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- CSS's system-ui and ui-monospace: browsers map them to the desktop's
       fonts themselves; this is for apps that ask fontconfig -->
  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>PatroneOS Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>ui-monospace</family>
    <prefer>
      <family>PatroneOS Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- The same width for each letter as the fonts documents ask for -->
  <alias binding="same">
    <family>Calibri</family>
    <prefer>
      <family>PatroneOS Document</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Arial</family>
    <prefer>
      <family>PatroneOS Classic</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Helvetica</family>
    <prefer>
      <family>PatroneOS Classic</family>
    </prefer>
  </alias>

  <!-- Patrone Sans, which PatroneOS Sans replaced: settings and documents
       that still name it -->
  <alias binding="same">
    <family>Patrone Sans</family>
    <prefer>
      <family>PatroneOS Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- Plain gray edges on text, not subpixel rendering's colored ones, for
       apps that go by fontconfig, such as browsers. GNOME's own setting is
       font-antialiasing (90_patrone.gschema.override). 10-sub-pixel-rgb.conf
       only adds its choice after this one -->
  <match target="pattern">
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
