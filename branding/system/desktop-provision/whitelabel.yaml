# Patrone's settings for the installer (installer/README.md), which reads the
# YAML files in /usr/share/desktop-provision/ in place of its own
# whitelabel.yml: Patrone's blue, and the page offering an update of the
# installer's snap hidden. slides/ has Patrone's slides, shown during the
# install, in English for every language.
#
# The pictures are the installer's own (assets/...), which Patrone's build
# of it makes Patrone's: the wordmark and P in place of Ubuntu's logo and
# mascot, the rest in Patrone's blue (installer/patch_source.py). The list is
# the installer's own whitelabel.yml's, so every page keeps its picture, less
# Landscape's pages. Some pages here belong to Ubuntu's first-boot setup
# (ubuntu_init: telemetry, Ubuntu Pro's), which Patrone doesn't use; the
# installer has none of them.
# Patrone's name comes from that build too: here, "flavor" can only be one of
# Ubuntu's flavors' names.
theme:
  accent-color: "#288BFA"
  elevated-button-color: "#288BFA"
  elevated-button-text-color: "#FFFFFF"
pages:
  locale:
    image: "assets/images/logo-light.svg"
    image-dark: "assets/images/logo-dark.svg"
  accessibility:
    image: "assets/images/accessibility.svg"
  try-or-install:
    image: "assets/images/mascot-light.svg"
    image-dark: "assets/images/mascot-dark.svg"
  # Patrone's licence agreement (installer/patrone_licence_page.dart). The
  # installer shows only the pages listed here, so without this line it
  # skipped it (2026-10-28).
  patrone-licence:
  rst:
    image: "assets/images/rst.svg"
  keyboard:
    image: "assets/images/keyboard.svg"
  network:
    image: "assets/images/wifi.svg"
  # The page offering an update of the installer's snap: an update would
  # start Ubuntu's own installer in place of Patrone's.
  refresh:
    visible: false
    image: "assets/images/mascot-light.svg"
    image-dark: "assets/images/mascot-dark.svg"
  autoinstall:
    image: "assets/images/disk.svg"
  autoinstall-direct:
    image: "assets/images/disk.svg"
  # Not the pages for "Automated with Landscape", Canonical's management
  # service, whose choice Patrone's build takes out
  source-selection:
    image: "assets/images/applications.svg"
  codecs-and-drivers:
    image: "assets/images/optimize.svg"
  not-enough-disk-space:
    image: "assets/images/no_space.svg"
  secure-boot:
    image: "assets/images/encryption.svg"
  bitlocker:
    image: "assets/images/bitlocker.svg"
  storage:
    image: "assets/images/disk.svg"
  guided-capabilities:
    image: "assets/images/encryption.svg"
  tpm-action:
    image: "assets/images/encryption.svg"
  eula:
  guided-resize:
    image: "assets/images/disk.svg"
  guided-reformat:
    image: "assets/images/disk.svg"
  passphrase-type:
    image: "assets/images/passphrase.svg"
  passphrase:
    image: "assets/images/passphrase.svg"
  recovery-key:
    image: "assets/images/passphrase.svg"
  confirm:
    image: "assets/images/summary.svg"
  identity:
    image: "assets/images/identity.svg"
  active-directory:
    image: "assets/images/online_accounts.svg"
  ubuntu-pro-onboarding:
    image: "assets/images/ubuntu_pro.svg"
  ubuntu-pro:
    image: "assets/images/ubuntu_pro.svg"
  ubuntu-pro-success:
    image: "assets/images/ubuntu_pro.svg"
  privacy:
  timezone:
  telemetry:
    image: "assets/images/telemetry.svg"
  welcome:
  done:
    image: "assets/images/mascot-light.svg"
    image-dark: "assets/images/mascot-dark.svg"
  storage-icon:
    image: "assets/images/ubuntu_storage_icon.svg"
  error:
    image: "assets/images/error.svg"
