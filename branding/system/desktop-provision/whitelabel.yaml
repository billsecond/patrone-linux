# Patrone's look for the installer, Ubuntu's ubuntu-desktop-bootstrap snap,
# which reads the YAML files in /usr/share/desktop-provision/ in place of its
# own whitelabel.yml: Patrone's name and blue, and Patrone's wordmark and P
# in place of Ubuntu's logo and mascot. The other pages keep the snap's own
# pictures (the paths under assets/ are the snap's), listed as its file
# lists them.
flavor:
  name: Patrone Linux
theme:
  accent-color: "#288BFA"
  elevated-button-color: "#288BFA"
  elevated-button-text-color: "#FFFFFF"
pages:
  locale:
    image: "/usr/share/desktop-provision/patrone-logo.svg"
    image-dark: "/usr/share/desktop-provision/patrone-logo-dark.svg"
  accessibility:
    image: "assets/images/accessibility.svg"
  try-or-install:
    image: "/usr/share/desktop-provision/patrone-mark.svg"
    image-dark: "/usr/share/desktop-provision/patrone-mark.svg"
  rst:
    image: "assets/images/rst.svg"
  keyboard:
    image: "assets/images/keyboard.svg"
  network:
    image: "assets/images/wifi.svg"
  refresh:
    image: "/usr/share/desktop-provision/patrone-mark.svg"
    image-dark: "/usr/share/desktop-provision/patrone-mark.svg"
  autoinstall:
    image: "assets/images/disk.svg"
  autoinstall-direct:
    image: "assets/images/disk.svg"
  autoinstall-landscape-domain:
    image: "assets/images/landscape.svg"
  autoinstall-landscape-qr:
  autoinstall-landscape-error:
    image: "assets/images/error.svg"
  source-selection:
    image: "assets/images/applications.svg"
  codecs-and-drivers:
    image: "assets/images/optimize.svg"
  not-enough-disk-space:
    image: "assets/images/no_space.svg"
  secure-boot:
    image: "assets/images/encryption.svg"
  bitlocker:
    image: "assets/images/bitlocker.svg"
  storage:
    image: "assets/images/disk.svg"
  guided-capabilities:
    image: "assets/images/encryption.svg"
  tpm-action:
    image: "assets/images/encryption.svg"
  eula:
  guided-resize:
    image: "assets/images/disk.svg"
  guided-reformat:
    image: "assets/images/disk.svg"
  passphrase-type:
    image: "assets/images/passphrase.svg"
  passphrase:
    image: "assets/images/passphrase.svg"
  recovery-key:
    image: "assets/images/passphrase.svg"
  confirm:
    image: "assets/images/summary.svg"
  identity:
    image: "assets/images/identity.svg"
  active-directory:
    image: "assets/images/online_accounts.svg"
  ubuntu-pro-onboarding:
    image: "assets/images/ubuntu_pro.svg"
  ubuntu-pro:
    image: "assets/images/ubuntu_pro.svg"
  ubuntu-pro-success:
    image: "assets/images/ubuntu_pro.svg"
  privacy:
  timezone:
  telemetry:
    image: "assets/images/telemetry.svg"
  welcome:
  done:
    image: "/usr/share/desktop-provision/patrone-mark.svg"
    image-dark: "/usr/share/desktop-provision/patrone-mark.svg"
  storage-icon:
    image: "/usr/share/desktop-provision/patrone-mark.svg"
  error:
    image: "assets/images/error.svg"
