# Installed as gnome-headless-session@.service.d/patrone-static-user.conf by
# patrone-remote-desktop.
#
# Works around Ubuntu bug 2171951: GDM's headless session unit runs as a
# DynamicUser, and systemd starts the system bus daemon with
# SYSTEMD_NSS_DYNAMIC_BYPASS=1, so the bus can't look that user up and closes
# its connection ("gdm-new-session: Failed: The connection is closed"); no
# headless session ever starts. Run it as GDM's own account instead, and keep
# the file protections DynamicUser implied. Remove once Ubuntu fixes the unit.
[Service]
DynamicUser=no
User=gdm
Group=gdm
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
RemoveIPC=yes
