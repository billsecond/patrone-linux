; FreeRDP proxy settings for patrone-remote-desktop. Remote Desktop clients
; connect here. The patrone-login plugin checks each sign-in with PAM and
; points the connection at the account's own GNOME Remote Desktop.
; Comments start with ";": FreeRDP's parser rejects the whole file at "#".

[Server]
Host=0.0.0.0
Port=3389
; The NT hashes NLA checks, kept current by the sign-in helper's --remember
SamFile=/var/lib/patrone-remote-desktop/sam

[Target]
; Chosen per connection by the patrone-login plugin
FixedTarget=false
; Each account's GNOME Remote Desktop, on localhost, has a self-signed
; certificate.
CertificatePolicy=allow

[Codecs]
RFX=true
NSC=true

[Channels]
GFX=true
DisplayControl=true
Clipboard=true
AudioInput=true
AudioOutput=true
DeviceRedirection=true
VideoRedirection=true
CameraRedirection=true
RemoteApp=false
PassthroughIsBlacklist=true
Passthrough=
Intercept=

[Input]
Keyboard=true
Mouse=true
Multitouch=true

[Security]
; NLA towards clients, as Windows: Remote Desktop Connection asks for the
; username and password, NLA checks them against the SAM file and then hands
; over the password, which the patrone-login plugin checks with PAM. Clients
; that can't do NLA aren't let in (they'd send no password anyway).
ServerTlsSecurity=false
ServerNlaSecurity=true
ServerExtSecurity=false
ServerRdpSecurity=false
; NLA towards GNOME Remote Desktop, with the account's random secret
ClientTlsSecurity=true
ClientNlaSecurity=true
ClientExtSecurity=false
ClientRdpSecurity=false
ClientAllowFallbackToTls=false

[Plugins]
; Required: without the sign-in check the proxy refuses to start.
Modules=patrone-login
Required=patrone-login

[Certificates]
CertificateFile=/var/lib/patrone-remote-desktop/proxy/tls.crt
PrivateKeyFile=/var/lib/patrone-remote-desktop/proxy/tls.key
