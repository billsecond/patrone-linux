; FreeRDP proxy settings for Hyper-V's enhanced session (VMConnect), from
; patrone-remote-desktop. Hyper-V's host connects here over a Hyper-V socket.
; The patrone-vmconnect plugin shows Patrone's login screen first, then
; connects the account's own GNOME Remote Desktop in its place.
; Comments start with ";": FreeRDP's parser rejects the whole file at "#".

[Server]
; vsock port 3389, for any address: where Hyper-V's enhanced session connects
Host=vsock://-1
Port=3389

[Target]
; Chosen per connection by the patrone-vmconnect plugin
FixedTarget=false
; The login screen and each account's GNOME Remote Desktop, both local, have
; self-signed certificates.
CertificatePolicy=allow

[Codecs]
RFX=true
NSC=true

[Channels]
GFX=true
DisplayControl=true
Clipboard=true
AudioInput=true
AudioOutput=true
DeviceRedirection=true
VideoRedirection=true
CameraRedirection=true
RemoteApp=false
PassthroughIsBlacklist=true
Passthrough=
; Dynamic channels one by one, so the plugin can log the ones the desktop
; opens and how VMConnect resizes it
Intercept=drdynvc

[Input]
Keyboard=true
Mouse=true
Multitouch=true

[Security]
; Nothing here asks for a password: the login screen does. Hyper-V's host
; relays VMConnect's own security, and asks for TLS or for standard RDP
; security.
ServerTlsSecurity=true
ServerNlaSecurity=false
ServerExtSecurity=false
ServerRdpSecurity=true
; TLS to the login screen; NLA, with the account's random secret, to its
; GNOME Remote Desktop (the plugin switches between them)
ClientTlsSecurity=true
ClientNlaSecurity=true
ClientExtSecurity=false
ClientRdpSecurity=false
ClientAllowFallbackToTls=false

[Plugins]
; Required: without it the proxy refuses to start.
Modules=patrone-vmconnect
Required=patrone-vmconnect

[patrone-vmconnect]
Greeter=/run/patrone-remote-desktop/greeter.sock
; Hyper-V's host does TLS and NLA with VMConnect, so the guest's side runs
; without them (FreeRDP's VMConnect mode)
HostHandlesSecurity=true

[Certificates]
CertificateFile=/var/lib/patrone-remote-desktop/vmconnect/tls.crt
PrivateKeyFile=/var/lib/patrone-remote-desktop/vmconnect/tls.key
